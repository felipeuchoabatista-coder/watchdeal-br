name: Coletar ofertas

# Coleta a cada 5 minutos, sem parar. Cada execução fica ligada ~5 h 15 min
# (scripts/coleta-continua.sh): coleta, grava no branch "data" e repete.
# Logo no início ela deixa a próxima execução esperando na fila (o
# "concurrency" abaixo segura a próxima até esta terminar). Se esta cair no
# meio, a próxima assume na hora.
#
# Antes, cada execução durava 5 min e agendava a seguinte. Com 288 passagens
# de bastão por dia, qualquer instabilidade do GitHub parava a coleta, e o
# cron, que deveria religá-la, quase nunca dispara.
#
# Um "Run workflow" manual ou um push no main também entra na fila, e a
# execução atual encerra em até 1 minuto para ele assumir. O cron é só
# reserva, para o caso de a corrente parar.
#
# Para pausar: Settings → Secrets and variables → Actions → Variables,
# crie COLETA_CONTINUA = false (volta a valer só o cron, uma coleta por vez).
#
# A coleta só grava no branch "data"; o app lê os dados direto de lá
# (raw.githubusercontent.com). O site no GitHub Pages é publicado pelo
# workflow "Publicar app", só quando o código muda.
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Consultar todas as fontes agora (ignora os intervalos)'
        type: boolean
        default: false
      testar_alertas:
        description: 'Enviar um alerta de teste (ntfy/Telegram)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: write
  actions: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # O GitHub encerra qualquer job com 6 h. O script sai antes (5 h 15 a 5 h 40).
    timeout-minutes: 355
    env:
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Marcar o início
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: |
          for n in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            [ "$n" -lt 3 ] && sleep 20
          done
          exit 1

      # Os dados (ofertas, histórico, cupons) ficam no branch "data".
      - name: Baixar dados anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        # Só começa do zero se o branch "data" realmente não existir (código 2
        # do ls-remote). Um erro do GitHub (código 128) não pode ser confundido
        # com "primeira execução": a coleta salvaria por cima do branch e
        # apagaria todo o histórico de preços. Nesse caso a execução falha sem
        # salvar nada, e o passo "Religar a coleta" agenda outra tentativa.
        run: |
          for n in 1 2 3 4; do
            rc=0
            git ls-remote --exit-code --heads origin data > /dev/null || rc=$?
            [ "$rc" -eq 0 ] && git clone --quiet --depth 1 --branch data \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data && break
            [ "$rc" -eq 2 ] && break
            rm -rf data
            [ "$n" -lt 4 ] || { echo "::error::Não consegui baixar o branch data (GitHub fora do ar?)."; exit 1; }
            echo "Falhou (tentativa $n de 4); repetindo em $((15 * 2 ** (n - 1)))s." >&2
            sleep $((15 * 2 ** (n - 1)))
          done
          if [ "$rc" -eq 2 ]; then
            echo "Primeira execução: começando sem histórico."
            mkdir -p data
          else
            rm -rf data/.git
          fi

      - name: Enviar alerta de teste
        if: inputs.testar_alertas
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          WATCHDEAL_APP_URL: ${{ env.APP_URL }}
        run: npm run testar-alertas

      - name: Coletar a cada 5 minutos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          WATCHDEAL_APP_URL: ${{ env.APP_URL }}
          AWESOMEAPI_TOKEN: ${{ secrets.AWESOMEAPI_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCAR: ${{ inputs.forcar == true || github.event_name == 'push' }}
          CONTINUA: ${{ vars.COLETA_CONTINUA != 'false' }}
        run: bash scripts/coleta-continua.sh

      # Se algo falhou (ex.: GitHub fora do ar no checkout ou ao baixar os
      # dados), garante uma próxima execução na fila para a coleta não parar.
      # Não depende do checkout: roda mesmo que ele tenha falhado.
      - name: Religar a coleta
        if: failure() && vars.COLETA_CONTINUA != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Espera completar 4 min desde o início, para não emendar uma
          # tentativa na outra enquanto o GitHub estiver fora do ar.
          espera=$(( 240 - ($(date +%s) - ${INICIO:-$(date +%s)}) ))
          if [ "$espera" -gt 0 ]; then sleep "$espera"; fi
          for n in $(seq 1 20); do
            if na_fila=$(gh api "repos/$GH_REPO/actions/workflows/coletar.yml/runs?per_page=10" \
                --jq "[.workflow_runs[] | select(.run_number > $GITHUB_RUN_NUMBER and .status != \"completed\")] | length"); then
              if [ "$na_fila" -gt 0 ]; then echo "A próxima execução já está na fila."; exit 0; fi
            fi
            if gh workflow run coletar.yml --ref main; then echo "Próxima execução disparada."; exit 0; fi
            sleep 30
          done
          echo "::error::Não consegui disparar a próxima execução (GitHub fora do ar?)."
          exit 1
