name: Coletar ofertas

# Coleta a cada 5 minutos: ao terminar, cada execução agenda a próxima
# (job "agendar"). O cron do GitHub é só reserva para religar a corrente
# se ela parar; ele sozinho atrasa muito em horários de pico.
# Para pausar: Settings → Secrets and variables → Actions → Variables,
# crie COLETA_CONTINUA = false (volta a valer só o cron).
#
# A coleta só grava no branch "data"; o app lê os dados direto de lá
# (raw.githubusercontent.com). O site no GitHub Pages é publicado pelo
# workflow "Publicar app", só quando o código muda: republicar a cada
# 5 min com o mesmo commit fazia o Pages dizer "success" e continuar
# servindo a versão antiga.
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Consultar todas as fontes agora (ignora os intervalos)'
        type: boolean
        default: false
      testar_alertas:
        description: 'Enviar um alerta de teste (ntfy/Telegram)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Os dados (ofertas, histórico, cupons) ficam no branch "data".
      - name: Baixar dados anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git clone --quiet --depth 1 --branch data \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
            rm -rf data/.git
          else
            echo "Primeira execução: começando sem histórico."
            mkdir -p data
          fi

      - name: Enviar alerta de teste
        if: inputs.testar_alertas
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          WATCHDEAL_APP_URL: ${{ env.APP_URL }}
        run: npm run testar-alertas

      - name: Coletar, pontuar e alertar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          WATCHDEAL_APP_URL: ${{ env.APP_URL }}
        run: |
          if [ "${{ inputs.forcar }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            npm run coletar -- --forcar
          else
            npm run coletar
          fi

      # Um único commit sempre (force push): o histórico de preços vive nos
      # próprios arquivos, então o branch não cresce para sempre.
      - name: Salvar dados no branch data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/ofertas.json ] || { echo "Nada para salvar."; exit 0; }
          cd data
          git init --quiet -b data
          git config user.name "watchdeal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "dados $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

  # Espera completar 5 minutos desde o início desta execução e dispara a
  # próxima. Só dispara se não houver outra na fila, para nunca existirem
  # duas correntes ao mesmo tempo (o cron de reserva também passa por aqui).
  agendar:
    needs: coletar
    if: ${{ !cancelled() && vars.COLETA_CONTINUA != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Agendar a próxima coleta
        run: |
          inicio=$(date -d "$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)" +%s)
          espera=$(( 300 - ($(date +%s) - inicio) ))
          if [ "$espera" -gt 0 ]; then echo "Aguardando ${espera}s"; sleep "$espera"; fi
          outras=$(gh run list --workflow coletar.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$outras" -gt 0 ]; then
            echo "Já existe coleta na fila ($outras); não agendo outra."
          else
            gh workflow run coletar.yml --ref main
            echo "Próxima coleta disparada."
          fi
