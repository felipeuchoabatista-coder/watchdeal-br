name: Publicar app

# Monta o app (web/) e publica no GitHub Pages quando o código muda, ou sob
# demanda pela aba Actions. Os dados não vão junto: o app lê direto do branch
# "data", que o workflow "Coletar ofertas" atualiza a cada 5 minutos.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'config/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # A publicação abaixo espera o Pages por até 25 min.
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Montar o app
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/
        run: npm run build

      - uses: actions/configure-pages@v6
      - id: artefato
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      # Faz o mesmo que actions/deploy-pages, com duas diferenças:
      # - Cada tentativa tem versão própria. O deploy-pages usa o commit como
      #   versão, então "Re-run" de uma publicação que falhou reaproveita a
      #   publicação cancelada e nunca termina.
      # - Espera até 25 min e, se o Pages demorar mais, não cancela. O
      #   deploy-pages desiste e cancela em 10 min. Em 04/11, o Pages ficou
      #   mais que isso em "updating_pages" em três publicações seguidas, e
      #   todas foram canceladas.
      - id: deploy
        name: Publicar no Pages
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.artefato.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const version = `${context.sha}.${context.runId}.${process.env.GITHUB_RUN_ATTEMPT}`;
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner,
              repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: version,
              oidc_token: await core.getIDToken(),
            });
            core.setOutput('page_url', data.page_url);
            const id = data.id ?? data.status_url.split('/').pop();
            core.info(`Publicação ${id} criada.`);
            const falhas = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
            const limite = Date.now() + 25 * 60_000;
            let erros = 0;
            while (Date.now() < limite) {
              await new Promise((resolve) => setTimeout(resolve, 15_000));
              try {
                const { data: st } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id });
                erros = 0;
                core.info(`Situação: ${st.status || '(sem status)'}`);
                if (st.status === 'succeed') return;
                if (falhas.includes(st.status)) return core.setFailed(`O Pages recusou a publicação: ${st.status}. Rode de novo (Re-run).`);
              } catch (err) {
                if (++erros >= 10) return core.setFailed(`Não consegui consultar o Pages: ${err.message}`);
                core.warning(`Consulta ao Pages falhou (${erros}): ${err.message}`);
              }
            }
            core.setFailed('O Pages não terminou em 25 min. A publicação não foi cancelada e pode terminar sozinha; se o site não mudar, rode de novo (Re-run).');
