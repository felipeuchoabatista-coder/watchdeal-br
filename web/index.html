<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WatchDeal BR</title>
    <meta name="description" content="Promoções e cupons 24h para Galaxy Watch Ultra, Watch8, Watch7, Watch FE, Watch6, Watch5 e Watch4, Xiaomi Watch 2 e TicWatch Pro 5 e Atlas." />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WatchDeal" />
    <link rel="icon" type="image/png" href="./icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // Aplica o tema salvo antes de pintar (evita piscar).
      try {
        var t = localStorage.getItem('wd:tema');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
